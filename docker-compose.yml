services:
  app:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
    container_name: dugunsalonu_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: dugunsalonu
      DB_USERNAME: dugunuser
      DB_PASSWORD: dugunpass

  db:
    image: mysql:8.0
    container_name: dugunsalonu_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: dugunsalonu
      MYSQL_USER: dugunuser
      MYSQL_PASSWORD: dugunpass
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    container_name: dugunsalonu_phpmyadmin
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: rootpass
      UPLOAD_LIMIT: 128M
    ports:
      - "8080:80"

volumes:
  db_data:
